<!doctype html>
<!-- Play Store feature graphic (1024x500). Render: chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1024,500 --screenshot=feature-graphic.png feature-graphic.html -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{position:relative;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
       background:radial-gradient(120% 140% at 0% 0%,#1f3a32 0%,#14211d 45%,#0e1513 100%);color:#e8ece9}
  .glow{position:absolute;right:-80px;top:40px;width:560px;height:560px;border-radius:50%;
        background:radial-gradient(circle,rgba(143,201,180,.28),rgba(143,201,180,0) 65%)}
  .copy{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .brand svg{width:84px;height:84px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .brand h1{margin:0;font-size:76px;font-weight:600;letter-spacing:-1.5px;line-height:1}
  .tag{font-size:34px;line-height:1.2;font-weight:500;margin:0 0 18px;letter-spacing:-.3px}
  .tag em{font-style:normal;color:#8fc9b4}
  .sub{font-size:21px;color:#a9b5b0;margin:0;letter-spacing:.1px}
  .phone{position:absolute;width:236px;height:524px;border-radius:30px;background:#0b0d0c;padding:7px;
         box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:24px;display:block}
  .p1{left:588px;top:58px;transform:rotate(-7deg)}
  .p2{left:772px;top:20px;transform:rotate(6deg)}
</style></head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="50" fill="#2E6B5E"/>
        <path fill="#fff" d="M30,40h48v6h-48zM30,54h48v6h-48zM30,68h30v6h-30z"/>
        <path fill="#9FE2C9" d="M66,74l6,6 14,-16 -4,-4 -10,12 -2,-2z"/></svg>
      <h1>Intack</h1>
    </div>
    <p class="tag">Shared lists and a family diary, <em>on your family's phones.</em></p>
    <p class="sub">No account&nbsp;·&nbsp;No ads&nbsp;·&nbsp;No subscription</p>
  </div>
  <div class="phone p1"><img src="screenshots/2-list.png"></div>
  <div class="phone p2"><img src="screenshots/3-diary.png"></div>
</body></html>
